<title>SmartStyle Sales</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: sticky top bar + filter strip, tabbed panels below. Black/blue/white brand, tabular numbers everywhere. */
:root{
  --bg:#ffffff; --panel:#f4f7fb; --ink:#0b1220; --muted:#566275; --line:#dbe3ee;
  --blue:#0a5bd8; --blue-ink:#ffffff; --blue-soft:#e7f0ff; --ghost:#b9c7db;
  --good:#127a3e; --good-soft:#e2f5e9; --warn:#995a00; --warn-soft:#fff2d9; --bad:#b42318; --bad-soft:#fde7e5;
  --display:"Space Grotesk",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0f1a; --panel:#121a29; --ink:#edf1f7; --muted:#9eabc0; --line:#243049;
  --blue:#5b9bff; --blue-ink:#06101f; --blue-soft:#13254a; --ghost:#3a4a66;
  --good:#5fd08f; --good-soft:#10301e; --warn:#f0b450; --warn-soft:#33260c; --bad:#ff7a6e; --bad-soft:#3a1714; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0f1a; --panel:#121a29; --ink:#edf1f7; --muted:#9eabc0; --line:#243049;
  --blue:#5b9bff; --blue-ink:#06101f; --blue-soft:#13254a; --ghost:#3a4a66;
  --good:#5fd08f; --good-soft:#10301e; --warn:#f0b450; --warn-soft:#33260c; --bad:#ff7a6e; --bad-soft:#3a1714; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
.tile.hero .muted{color:inherit;opacity:.75}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--bg)}
.hin{max-width:1180px;margin:0 auto;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:.01em;flex:1;min-width:160px}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:.75rem;opacity:.7;letter-spacing:.04em}
.syncinfo{font-size:.8rem;opacity:.85;text-align:right}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--blue);color:var(--blue-ink);border:0;border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
header .btn.sec{color:var(--bg);border-color:rgba(255,255,255,.3)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.filters select,.filters input,.field select,.field input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:.9rem;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink);min-width:0}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav.tabs a{padding:9px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--blue)}
.banner{padding:12px 14px;border-radius:6px;font-size:.92rem}
.banner.warn{background:var(--warn-soft);color:var(--warn)}.banner.bad{background:var(--bad-soft);color:var(--bad)}.banner.info{background:var(--blue-soft);color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.tile{background:var(--panel);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .k{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--display);font-size:1.75rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.tile .d{font-size:.8rem;color:var(--muted)}
.tile.hero{background:var(--ink);color:var(--bg)}.tile.hero .k,.tile.hero .d{color:inherit;opacity:.75}
.up{color:var(--good)}.down{color:var(--bad)}
.tile.hero .up,.tile.hero .down{color:inherit;opacity:1;font-weight:700}
h2{font-family:var(--display);font-size:1.15rem;margin:0}
.card{border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.n,th.n{text-align:right}
tr.me td{background:var(--blue-soft)}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.o-won{background:var(--good-soft);color:var(--good)}.o-lost{background:var(--bad-soft);color:var(--bad)}.o-open{background:var(--warn-soft);color:var(--warn)}.o-other{background:var(--panel);color:var(--muted)}
.bar{height:8px;background:var(--panel);border-radius:4px;overflow:hidden;min-width:80px}
.bar>i{display:block;height:100%;background:var(--blue)}
.bar.done>i{background:var(--good)}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.muted{color:var(--muted)}.small{font-size:.82rem}
.empty{padding:40px 16px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty p{max-width:60ch}
.field{display:flex;flex-direction:column;gap:3px;font-size:.78rem;font-weight:600;color:var(--muted)}
.form{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.prog{height:6px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden;width:160px}
.prog>i{display:block;height:100%;background:var(--blue);width:0}
a{color:var(--blue)}
.lnk{background:none;border:0;padding:0;color:var(--blue);cursor:pointer;text-decoration:underline;font-size:.85rem}
@media (max-width:760px){.grid2{grid-template-columns:1fr}.syncinfo{text-align:left}.tile .v{font-size:1.45rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header><div class="hin">
  <div class="brand">SmartStyle Sales<small>Live from Jobber</small></div>
  <div class="syncinfo" id="syncinfo">Loading…</div>
  <div class="prog" id="prog" hidden><i></i></div>
  <button class="btn" id="syncBtn" hidden>Refresh from Jobber</button>
</div></header>

<div class="wrap">
  <div id="banners"></div>
  <div class="filters" id="filters">
    <label>Period<select id="fPeriod">
      <option value="today">Today</option><option value="yesterday">Yesterday</option>
      <option value="week">This week</option><option value="lastweek">Last week</option>
      <option value="month" selected>This month</option><option value="lastmonth">Last month</option>
      <option value="quarter">This quarter</option><option value="year">This year</option>
      <option value="lastyear">Last year</option><option value="custom">Custom…</option></select></label>
    <label id="lFrom" hidden>From<input type="date" id="fFrom"></label>
    <label id="lTo" hidden>To<input type="date" id="fTo"></label>
    <label>Salesperson<select id="fRep"><option value="">Everyone</option></select></label>
    <label>Division<select id="fDiv"><option value="">Both</option><option value="direct">Direct</option><option value="contractor">Contractor</option></select></label>
    <label>Lead source<select id="fSrc"><option value="">All</option></select></label>
  </div>
  <nav class="tabs" id="tabs">
    <a href="#overview">Overview</a><a href="#leaderboard">Leaderboard</a><a href="#sources">Lead sources</a>
    <a href="#followup">Follow-up</a><a href="#goals">Goals</a><a href="#quotes">Quotes</a><a href="#rules">Rules</a>
  </nav>
  <main id="main"></main>
</div>

<script>
(() => {
"use strict";
const SERVER = "Jobber";
const SINCE = "2025-01-01T00:00:00Z";      // history kept from here
const TZ = "America/New_York";
const AUTO_REFRESH_MIN = 60;

// ---------- small helpers
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k instanceof Node ? k : String(k));
  return el;
}
const dayFmt = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });
const day = iso => iso ? dayFmt.format(new Date(iso)) : null;
const addDays = (ds, n) => { const d = new Date(ds + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const shiftYear = (ds, n) => { let [y, m, d] = ds.split("-"); y = +y + n; if (m === "02" && d === "29") d = "28"; return `${y}-${m}-${d}`; };
const daysBetween = (a, b) => Math.round((new Date(b + "T00:00:00Z") - new Date(a + "T00:00:00Z")) / 864e5);
const money = x => x == null || isNaN(x) ? "—" : "$" + Math.round(x).toLocaleString("en-US");
const pct = x => x == null || isNaN(x) ? "—" : Math.round(x * 100) + "%";
const least = (...xs) => xs.filter(Boolean).sort()[0] || null;
const numId = gid => { try { return atob(gid).split("/").pop(); } catch { return gid.replace(/[^A-Za-z0-9_-]/g, ""); } };
const safeUrl = u => typeof u === "string" && u.startsWith("https://") ? u : null;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const tabId = Math.random().toString(36).slice(2);

// ---------- state
const S = {
  quotes: {}, clients: {}, overrides: {}, goals: {}, manual: {}, meta: null,
  bucketsSeen: new Set(), clientBucketsSeen: new Set(),
  db: null, mcp: null, user: null, myName: null, canWrite: true,
  loaded: { quotes: false, clients: false }, syncing: false, prog: null, error: null,
};

// ---------- business rules (same as docs/RULES.md)
function parseDivision(v) {
  if (!v) return null; const s = String(v).toLowerCase();
  if (s.includes("contract")) return "contractor";
  if (s.includes("direct") || s.includes("resid") || s.includes("home")) return "direct";
  return null;
}
function derive(id, q) {
  const c = S.clients[q.cid] || {};
  const o = S.overrides[id] || {};
  const st = q.st;
  let outcome;
  if (q.del) outcome = "deleted";
  else if (o.outcome === "exclude") outcome = "excluded";
  else if (o.outcome) outcome = o.outcome;
  else if (st === "draft") outcome = "draft";
  else if (!(q.t > 0)) outcome = "excluded";
  else if (st === "approved" || st === "converted") outcome = "won";
  else if (st === "archived" && q.a) outcome = "won";
  else if (st === "archived") outcome = "lost";
  else if (st === "awaiting_response" || st === "changes_requested") outcome = "open";
  else outcome = "unknown";
  const presentedAt = q.fp || least(q.s, q.a, q.cv);
  const presentedOn = day(presentedAt);
  const tags = (c.tags || []).map(t => String(t).toLowerCase());
  const division = o.division || parseDivision(c.div) ||
    (tags.some(t => t.startsWith("contractor")) || /^contractor/i.test(c.ls || "") ? "contractor" : "direct");
  const won = outcome === "won";
  return {
    id, num: q.n, client: c.name || q.cn || "(no name)", phone: c.phone || "",
    rep: o.rep || q.spn || "Unassigned", division, source: (c.ls || "").trim() || "Unknown",
    status: st, outcome, quoted: q.fa ?? q.t, current: q.t, presentedOn,
    soldOn: won ? day(q.a || q.cv || presentedAt) : null,
    inRate: ["won", "open", "lost"].includes(outcome) && !!presentedOn,
    uri: safeUrl(q.uri), manual: false, override: o.reason ? o : null,
  };
}
function deriveManual(id, m) {
  const won = m.outcome === "won";
  return { id, num: m.ref || "Manual", client: m.client, phone: "", rep: m.rep || "Unassigned",
    division: m.division || "direct", source: m.source || "Manual entry", status: "manual",
    outcome: m.outcome, quoted: +m.total, current: +m.total, presentedOn: m.presentedOn,
    soldOn: won ? (m.soldOn || m.presentedOn) : null, inRate: true, uri: null, manual: true };
}
let ROWS = [];
function rebuild() {
  ROWS = Object.entries(S.quotes).map(([id, q]) => derive(id, q))
    .concat(Object.entries(S.manual).map(([id, m]) => deriveManual(id, m)))
    .filter(r => r.outcome !== "deleted");
}
function metrics(rows, start, end) {
  const pres = rows.filter(r => r.inRate && r.presentedOn >= start && r.presentedOn <= end);
  const won = pres.filter(r => r.outcome === "won").length;
  const open = pres.filter(r => r.outcome === "open").length;
  const lost = pres.filter(r => r.outcome === "lost").length;
  const sold = rows.filter(r => r.outcome === "won" && r.soldOn >= start && r.soldOn <= end);
  const soldDollars = sold.reduce((a, r) => a + (r.current || 0), 0);
  const quotedDollars = pres.reduce((a, r) => a + (r.quoted || 0), 0);
  return { presented: pres.length, won, open, lost,
    closeRate: pres.length ? won / pres.length : null,
    avgQuote: pres.length ? quotedDollars / pres.length : null,
    soldCount: sold.length, soldDollars, avgSale: sold.length ? soldDollars / sold.length : null };
}

// ---------- filters & periods
function todayNY() { return day(new Date().toISOString()); }
function period() {
  const t = todayNY(), p = $("#fPeriod").value;
  const [y, m] = t.split("-").map(Number);
  const mStart = t.slice(0, 8) + "01";
  const dow = (new Date(t + "T00:00:00Z").getUTCDay() + 6) % 7; // Monday = 0
  const q0 = Math.floor((m - 1) / 3) * 3 + 1;
  switch (p) {
    case "today": return [t, t, "Today"];
    case "yesterday": { const d = addDays(t, -1); return [d, d, "Yesterday"]; }
    case "week": return [addDays(t, -dow), t, "This week"];
    case "lastweek": return [addDays(t, -dow - 7), addDays(t, -dow - 1), "Last week"];
    case "month": return [mStart, t, "This month"];
    case "lastmonth": { const e = addDays(mStart, -1); return [e.slice(0, 8) + "01", e, "Last month"]; }
    case "quarter": return [`${y}-${String(q0).padStart(2, "0")}-01`, t, "This quarter"];
    case "year": return [`${y}-01-01`, t, "This year"];
    case "lastyear": return [`${y - 1}-01-01`, `${y - 1}-12-31`, "Last year"];
    case "custom": { const a = $("#fFrom").value || mStart, b = $("#fTo").value || t; return [a <= b ? a : b, a <= b ? b : a, "Custom range"]; }
  }
}
function filtered(ignoreRep) {
  const rep = $("#fRep").value, div = $("#fDiv").value, src = $("#fSrc").value;
  return ROWS.filter(r => (ignoreRep || !rep || r.rep === rep) && (!div || r.division === div) && (!src || r.source === src));
}
function fillSelect(sel, values, allLabel) {
  const cur = sel.value;
  sel.replaceChildren(h("option", { value: "" }, allLabel), ...values.map(v => h("option", { value: v }, v)));
  sel.value = values.includes(cur) ? cur : "";
}

// ---------- rendering
const TABS = ["overview", "leaderboard", "sources", "followup", "goals", "quotes", "rules"];
function currentTab() { const t = location.hash.slice(1); return TABS.includes(t) ? t : "overview"; }
function delta(cur, prev, kind) {
  if (cur == null || prev == null) return h("span", { class: "muted" }, "no data last year");
  const d = cur - prev;
  if (Math.abs(d) < 1e-9) return h("span", null, "same as last year");
  const sign = d > 0 ? "+" : "−";
  const txt = kind === "pct" ? `${sign}${Math.abs(Math.round(d * 100))} pts` :
    prev ? `${sign}${Math.abs(Math.round(d / prev * 100))}%` :
    kind === "count" ? `${sign}${Math.abs(d)}` : `${sign}${money(Math.abs(d))}`;
  return h("span", { class: d > 0 ? "up" : "down" }, txt + " vs last year");
}
function tile(k, v, d, hero) { return h("div", { class: "tile" + (hero ? " hero" : "") }, h("div", { class: "k" }, k), h("div", { class: "v" }, v), h("div", { class: "d" }, d)); }

function render() {
  rebuild();
  const reps = [...new Set(ROWS.map(r => r.rep))].sort();
  fillSelect($("#fRep"), reps, "Everyone");
  if (S.myName && !S.repDefaulted && reps.includes(S.myName)) { $("#fRep").value = S.myName; S.repDefaulted = true; }
  fillSelect($("#fSrc"), [...new Set(ROWS.map(r => r.source))].sort(), "All");
  const custom = $("#fPeriod").value === "custom";
  $("#lFrom").hidden = $("#lTo").hidden = !custom;
  for (const a of document.querySelectorAll("#tabs a")) a.toggleAttribute("aria-current", a.getAttribute("href") === "#" + currentTab()) && a.setAttribute("aria-current", "page");
  renderHeader(); renderBanners();
  const main = $("#main");
  if (!S.loaded.quotes) { main.replaceChildren(h("p", { class: "muted" }, "Loading saved numbers…")); return; }
  if (!Object.keys(S.quotes).length && currentTab() !== "rules") { main.replaceChildren(emptyState()); return; }
  const fn = { overview, leaderboard, sources, followup, goals, quotes, rules }[currentTab()];
  main.replaceChildren(fn());
}

function emptyState() {
  const box = h("div", { class: "empty card" },
    h("h2", null, "No sales data yet"),
    h("p", null, "Click below to load your quotes from Jobber, going back to January 2025. The first load reads every quote and every client one at a time. It takes about 10–20 minutes. Keep this page open while it runs. After that, refreshes take under a minute."));
  if (S.mcp) box.append(h("button", { class: "btn", onclick: () => sync(true), disabled: S.syncing }, S.syncing ? "Loading…" : "Load my Jobber data"));
  else box.append(h("p", { class: "muted" }, "This view can't reach Jobber. Open the page on claude.ai while signed in with Jobber connected."));
  return box;
}

function overview() {
  const [s, e, label] = period();
  const rows = filtered();
  const m = metrics(rows, s, e), ly = metrics(rows, shiftYear(s, -1), shiftYear(e, -1));
  const openRows = rows.filter(r => r.outcome === "open" && r.inRate);
  const target = 0.40;
  const wrap = h("div", { style: "display:flex;flex-direction:column;gap:18px" });
  wrap.append(h("div", { class: "small muted" }, `${label}: ${s} to ${e}${$("#fRep").value ? " · " + $("#fRep").value : ""}`));
  wrap.append(h("div", { class: "tiles" },
    tile("Close rate", pct(m.closeRate), h("span", null, delta(m.closeRate, ly.closeRate, "pct"), ` · goal ${pct(target)}`), true),
    tile("Sold", money(m.soldDollars), delta(m.soldDollars, ly.soldDollars)),
    tile("Quotes presented", m.presented.toLocaleString(), delta(m.presented, ly.presented, "count")),
    tile("Won / open / lost", `${m.won} / ${m.open} / ${m.lost}`, "of quotes presented"),
    tile("Avg quote", money(m.avgQuote), delta(m.avgQuote, ly.avgQuote)),
    tile("Avg sale", money(m.avgSale), delta(m.avgSale, ly.avgSale)),
    tile("Open quotes (all)", openRows.length.toLocaleString(), money(openRows.reduce((a, r) => a + r.current, 0)) + " waiting"),
  ));
  wrap.append(monthChart(rows, e.slice(0, 4)));
  const g = h("div", { class: "grid2" });
  g.append(groupCard("Direct vs Contractor", rows, s, e, r => r.division === "direct" ? "Direct" : "Contractor"));
  g.append(groupCard("Top lead sources", rows, s, e, r => r.source, 6));
  wrap.append(g);
  return wrap;
}

function monthChart(rows, year) {
  const ly = String(+year - 1);
  const sum = (y, mm) => rows.filter(r => r.outcome === "won" && r.soldOn && r.soldOn.startsWith(`${y}-${mm}`)).reduce((a, r) => a + r.current, 0);
  const months = Array.from({ length: 12 }, (_, i) => String(i + 1).padStart(2, "0"));
  const cur = months.map(mm => sum(year, mm)), prev = months.map(mm => sum(ly, mm));
  const max = Math.max(1, ...cur, ...prev);
  const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); return Math.ceil(max / p) * p; })();
  const W = 720, H = 240, L = 56, B = 26, T = 10, R = 8, cw = (W - L - R) / 12;
  const y = v => T + (H - T - B) * (1 - v / nice);
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg"); svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", `Sold dollars by month, ${year} vs ${ly}`);
  const el = (n, a, txt) => { const x = document.createElementNS(ns, n); for (const k in a) x.setAttribute(k, a[k]); if (txt != null) x.textContent = txt; svg.append(x); return x; };
  for (let i = 0; i <= 4; i++) {

    const missing = known.filter(id => !listedIds.has(id));
    if (known.length > 50 && missing.length > Math.max(25, known.length * 0.1))
      throw new StopSync(`Jobber returned ${listed.length} quotes, but ${missing.length} saved quotes are missing. That looks like a Jobber problem, not real deletes. Nothing was changed. Try again later.`);

    // 2. Re-read new or changed quotes (salesperson + transition dates live on the detail).
    const changed = listed.filter(q => { const cur = S.quotes[numId(q.id)]; return !cur || !cur.d || cur.u !== q.updatedAt; });
    const clientsToRead = new Set();
    S.prog = { done: 0, total: changed.length + 1, text: "" };
    let sinceFlush = 0;
    await pool(changed, 3, async (lq) => {
      const id = numId(lq.id);
      try {
        const d = (await call("get_quote", { quoteId: lq.id })).quote;
        const st = String(d.status || lq.status || "").toLowerCase();
        if (!STATUSES.has(st)) throw new Error("unknown status " + st);
        const prev = S.quotes[id] || {};
        const lt = d.lastTransitioned || {};
        const s = d.sentAt || lq.sentAt || null, a = lt.approvedAt || lq.approvedAt || null, cv = lt.convertedAt || null;
        const total = Number((d.amounts && d.amounts.total) ?? lq.total ?? 0);
        const fp = prev.fp || least(s, a, cv);
        const rec = { n: d.quoteNumber || lq.quoteNumber, st, c: d.createdAt || lq.createdAt, u: lq.updatedAt, s, a, cv,
          t: total, cid: d.client ? numId(d.client.id) : (lq.client ? numId(lq.client.id) : null),
          cn: (d.client && d.client.name) || (lq.client && lq.client.name) || null,
          spn: d.salesperson && d.salesperson.name ? d.salesperson.name : null,
          uri: d.jobberWebUri || lq.jobberWebUri || null, fp, fa: prev.fa ?? (fp ? total : null), d: 1, del: false };
        const b = bucketOf(rec.c);
        (pendingQ[b] ||= {})[id] = rec;
        S.quotes[id] = rec;
        if (lq.client && lq.client.id) clientsToRead.add(lq.client.id);
      } catch (e) { if (e instanceof StopSync) throw e; failed++; }
      S.prog.done++; S.prog.text = `Reading quotes ${S.prog.done} of ${changed.length}`; renderHeader();
      if (++sinceFlush >= 40) { sinceFlush = 0; await flushSafe(); }
    });
    await flushSafe();

    // 3. Clients of changed quotes, plus any never read.
    for (const q of listed) if (q.client && !S.clients[numId(q.client.id)]) clientsToRead.add(q.client.id);
    const cl = [...clientsToRead];
    S.prog = { done: 0, total: cl.length + 1, text: "" };
    await pool(cl, 3, async (gid) => {
      try {
        const c = (await call("get_client", { clientId: gid })).client;
        const id = numId(c.id);
        const div = (c.customFields || []).find(f => String(f.label || "").trim().toLowerCase() === "division");
        const rec = { name: c.name || c.companyName || "(no name)", ls: c.leadSource || (c.sourceAttribution && c.sourceAttribution.displayLeadSource) || "",
          tags: ((c.tags && c.tags.nodes) || []).map(t => t.label).filter(Boolean),
          div: div && typeof div.value === "string" ? div.value : "", phone: (c.phones && (c.phones.find(p => p.primary) || c.phones[0]) || {}).friendly || c.phone || "",
          co: !!c.isCompany };
        (pendingC[clientBucket(id)] ||= {})[id] = rec;
        S.clients[id] = rec;
      } catch (e) { if (e instanceof StopSync) throw e; failed++; }
      S.prog.done++; S.prog.text = `Reading clients ${S.prog.done} of ${cl.length}`; renderHeader();
      if (S.prog.done % 40 === 0) await flushSafe();
    });
    await flushSafe();

    // 4. Quotes that vanished: confirm each one with Jobber before marking it deleted.
    for (const id of missing) {
      const cur = S.quotes[id];
      const gid = btoa("gid://Jobber/Quote/" + id);
      try { await call("get_quote", { quoteId: gid }); }   // still exists (outside the list window): leave it
      catch (e) {
        if (e instanceof StopSync) throw e;
        if (/not.?found|no quote|does not exist|couldn.?t find|could not find/i.test(String(e.message || ""))) {
          (pendingQ[bucketOf(cur.c)] ||= {})[id] = { del: true }; cur.del = true; deleted++;
        } else failed++;
      }
    }
    await flushSafe();
    S.meta = { at: new Date().toISOString(), count: listed.length, failed, deleted, by: S.myName || "" };
    await S.db.doc("meta/sync").set(S.meta);
  } catch (e) {
    S.error = e instanceof StopSync ? e.message : "Refresh stopped: " + ((e && (e.message || e.code)) || e) + ". What was read so far is saved. Click Refresh to continue.";
    try { await flush(pendingQ, pendingC); } catch {}
  } finally {
    clearInterval(renew);
    S.syncing = false; S.prog = null; render();
  }
  async function flushSafe() {
    try { await flush(pendingQ, pendingC); }
    catch (e) { if (e && e.code === "quota_exceeded") throw new StopSync("The saved-data limit for this page is full. Tell Claude."); throw e; }
  }
}

// ---------- boot
for (const id of ["#fPeriod", "#fFrom", "#fTo", "#fRep", "#fDiv", "#fSrc"]) $(id).addEventListener("change", render);
window.addEventListener("hashchange", render);
$("#syncBtn").addEventListener("click", () => sync(true));
render();

(async () => {
  const use = n => (window.claude && typeof window.claude.use === "function") ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  const [db, mcp, user] = await Promise.all([use("db"), use("mcp"), use("user")]);
  S.db = db; S.mcp = mcp; S.user = user;
  if (user) {
    try { const me = await user.me(); S.myName = (me && me.name) || null; } catch {}
    try { const cw = await user.can("data.write"); S.canWrite = cw !== false; } catch {}
  }
  if (!db) { S.loaded.quotes = true; render(); return; }
  const timer = setTimeout(() => { if (!S.loaded.quotes) { S.loaded.quotes = true; S.error = "Saved numbers are taking a while to load. They'll appear when they arrive."; render(); } }, 10000);
  const onErr = e => { S.error = "Lost the connection to saved data (" + (e && e.code) + "). Reload the page."; render(); };
  db.collection("quotes").onSnapshot(snap => {
    if (S.syncing) { for (const d of snap.docs) S.bucketsSeen.add(d.id); return; } // our own writes; local state is already current
    const next = {};
    for (const d of snap.docs) { S.bucketsSeen.add(d.id); const qmap = (d.data() || {}).q || {}; for (const [id, q] of Object.entries(qmap)) next[id] = q; }
    S.quotes = next;
    if (!snap.metadata.fromCache) { S.loaded.quotes = true; clearTimeout(timer); maybeAutoSync(); }
    render();
  }, onErr);
  db.collection("clients").onSnapshot(snap => {
    if (S.syncing) { for (const d of snap.docs) S.clientBucketsSeen.add(d.id); return; }
    const next = {};
    for (const d of snap.docs) { S.clientBucketsSeen.add(d.id); Object.assign(next, (d.data() || {}).c || {}); }
    S.clients = next; render();
  }, onErr);
  db.doc("meta/sync").onSnapshot(d => { if (!S.syncing) { S.meta = d.exists ? d.data() : null; if (S.loaded.quotes) maybeAutoSync(); render(); } }, onErr);
  db.doc("settings/overrides").onSnapshot(d => { S.overrides = (d.exists && d.data().o) || {}; render(); }, onErr);
  db.doc("settings/goals").onSnapshot(d => { S.goals = (d.exists && d.data().g) || {}; render(); }, onErr);
  db.doc("settings/manual").onSnapshot(d => { S.manual = (d.exists && d.data().m) || {}; render(); }, onErr);
})();

let autoTried = false;
function maybeAutoSync() {
  if (autoTried || !S.mcp || !S.meta || !S.meta.at || S.syncing) return;
  if (Date.now() - new Date(S.meta.at) < AUTO_REFRESH_MIN * 60000) return;
  autoTried = true; setTimeout(() => sync(false), 1500);
}
})();
</script>
