<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>SmartStyle Call</title>
<style>
  body { margin: 0; background: #000; color: #fff; font: 20px/1.4 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 32px 16px; display: grid; gap: 16px; }
  h1 { margin: 0; font-size: 26px; }
  .num { font-size: 30px; font-weight: 800; color: #0fa8d6; }
  a.btn { display: block; text-align: center; font-weight: 800; text-decoration: none; border-radius: 12px; padding: 18px 12px; font-size: 21px; }
  .quo { background: #0fa8d6; color: #000; }
  .cell { border: 2px solid #fff; color: #fff; }
  p { margin: 0; color: #c9d3da; font-size: 17px; }
</style>
</head>
<body>
<main>
  <h1>Calling from Sales</h1>
  <div class="num" id="num">No number</div>
  <a class="btn quo" id="quo" href="#">Call from Quo (Sales)</a>
  <a class="btn cell" id="cell" href="#">Call from my cell</a>
  <p>After the call, go back to the SmartStyle app and tap Record call.</p>
</main>
<script>
  // The customer's number rides in the # part of the link, which the browser never sends to any server.
  var SALES = "5748215323";
  var digits = decodeURIComponent(location.hash.slice(1)).replace(/\D/g, "").replace(/^1(?=\d{10}$)/, "");
  if (digits.length === 10) {
    var quo = "openphone://dial?number=" + digits + "&from=" + SALES + "&action=call";
    document.getElementById("num").textContent = "(" + digits.slice(0, 3) + ") " + digits.slice(3, 6) + "-" + digits.slice(6);
    document.getElementById("quo").href = quo;
    document.getElementById("cell").href = "tel:+1" + digits;
    location.href = quo; // try to open Quo right away; the buttons are the fallback
  }
</script>
</body>
</html>
